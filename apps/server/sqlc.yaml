version: "2"
sql:
  - engine: "postgresql"
    schema: "../../db/schema.sql"
    queries: "internal/database/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/database/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        # Filtered job views retain the old non-null field contract; the unified
        # table enforces required fields with job_type-specific CHECK constraints.
        overrides:
          # Active extension views filter for presence; CHECK constraints guarantee
          # their required fields retain the original non-null read contract.
          - column: "poses.device_id"
            go_type: "int32"
          - column: "poses.captured_at"
            go_type:
              import: "time"
              type: "Time"
