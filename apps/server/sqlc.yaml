version: "2"
sql:
  - engine: "postgresql"
    schema: "../../db/schema.sql"
    queries: "internal/database/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/database/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
